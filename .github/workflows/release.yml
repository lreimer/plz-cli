on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload assets for
        required: true
        type: string
  release:
    types:
      - created

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always

name: Create Release / Upload Assets

jobs:
  version_bump:
    name: Bump cache version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Cache Version
        run: .github/.deploy/bump.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-version
          path: Cargo.toml

  windows:
    name: Build for Windows
    runs-on: windows-latest
    needs: [version_bump]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: pkg-version

      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: "Move to outputs/ folder"
        run: |
          mkdir outputs
          cp target/release/*.exe outputs/plz-win-x86_64.exe

      - name: Upload to temporary storage
        uses: actions/upload-artifact@v4
        with:
          name: output-artifact-windows
          path: outputs

  linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    needs: [version_bump]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: pkg-version

      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Install cargo-deb
        run: cargo install cargo-deb
        continue-on-error: true

      - name: Create deb package
        run: cargo deb

      - name: "Move to outputs/ folder"
        run: |
          mkdir outputs
          cp target/release/plz outputs/plz-linux-x86_64
          cp target/debian/*.deb outputs/plz-linux-x86_64.deb

      - name: Upload to temporary storage
        uses: actions/upload-artifact@v4
        with:
          name: output-artifact-linux
          path: outputs

  linux-musl:
    name: Musl build for Linux
    runs-on: ubuntu-latest
    needs: [version_bump]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: pkg-version

      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Rust musl toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          override: true
          profile: minimal

      - name: Install gcc-musl compiler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version || true

      - name: Build
        run: cargo build --release --target=x86_64-unknown-linux-musl

      - name: "Move to outputs/ folder"
        run: |
          mkdir outputs
          cp target/x86_64-unknown-linux-musl/release/plz outputs/plz-linux-musl-x86_64

      - name: Upload to temporary storage
        uses: actions/upload-artifact@v4
        with:
          name: output-artifact-linux-musl
          path: outputs

  macos:
    name: Build for Mac
    runs-on: macos-latest
    needs: [version_bump]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: pkg-version

      - name: Set up cargo cache
        uses: actions/cache@v3
        continue-on-error: false
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install ARM target
        run: rustup update && rustup target add aarch64-apple-darwin

      - name: ARM Build
        run: cargo build --release --target=aarch64-apple-darwin

      - name: "Move to outputs/ folder"
        run: |
          mkdir outputs
          cp target/aarch64-apple-darwin/release/plz outputs/plz-darwin-aarch64

      - name: Upload to temporary storage
        uses: actions/upload-artifact@v4
        with:
          name: output-artifact-macos
          path: outputs

  release:
    name: Release assets
    runs-on: ubuntu-latest
    needs: [windows, linux, linux-musl, macos]

    steps:
      - name: Download from temporary storage
        uses: actions/download-artifact@v4
        with:
          pattern: output-artifact-*
          path: outputs
          merge-multiple: true

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: outputs/*
          tag: ${{ inputs.tag || github.ref }}
          overwrite: true
          file_glob: true
